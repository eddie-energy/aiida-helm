apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-timescaledb
  {{- include "aiida.timescaledb.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.timescaledb.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-timescaledb
  template:
    metadata:
    {{- include "aiida.timescaledb.labels" . | indent 6 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: timescaledb
          image: "timescale/timescaledb:{{ .Values.timescaledb.version }}"
          ports:
            - name: timescaledb
              containerPort: {{ .Values.timescaledb.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.timescaledb.database }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: password
            - name: EMQX_DATABASE_PASSWORD
              value: {{ .Values.emqx.databasePassword }}
          volumeMounts:
            - name: timescaledb-data
              mountPath: /var/lib/postgresql/data
            - name: timescaledb-config
              mountPath: /docker-entrypoint-initdb.d/00-replace_password_with_env.sh
              subPath: replace-password-with-env.sh
            - name: timescaledb-config
              mountPath: /tmp/create-emqx-user.sql
              subPath: create-emqx-user.sql
          readinessProbe:
            tcpSocket:
              port: timescaledb

      volumes:
        - name: timescaledb-config
          configMap:
            name: {{ .Release.Name }}-timescaledb-config

  volumeClaimTemplates:
    - metadata:
        name: timescaledb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.timescaledb.storageSize }}

