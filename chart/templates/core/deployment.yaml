apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core
  {{- include "aiida.core.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-core
  template:
    metadata:
    {{- include "aiida.core.labels" . | indent 6 }}
    spec:
      containers:
        - name: aiida-core
          image: "ghcr.io/eddie-energy/aiida:{{ .Values.core.version }}"
          ports:
            - containerPort: {{ .Values.core.port }}
              name: core
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: {{ .Values.core.path }}
            - name: KEYLCOAK_REALM
              value: "EDDIE"
            - name: KEYLCOAK_CLIENT
              value: "AIIDA"
            - name: SPRING_DATASOURCE_URL
              value: "{{ include "aiida.timescaledb.jdbc-url" . }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: password
            - name: AIIDA_STREAMER_POLL_INTERVAL
              value: {{ .Values.core.streamerPollInterval | quote }}
            - name: AIIDA_EXTERNAL_HOST
              value: "{{ include "aiida.core.external-host" . }}"
            - name: KEYCLOAK_INTERNAL_HOST
              value: "{{ include "aiida.keycloak.external-host" . }}"
            - name: KEYCLOAK_EXTERNAL_HOST
              value: "{{ include "aiida.keycloak.external-host" . }}"
            - name: KEYCLOAK_CLIENT_SECRET
              value: "{{ .Values.keycloak.clientSecret }}"
            - name: MQTT_INTERNAL_HOST
              value: "{{ include "aiida.emqx.internal-host" . }}"
            - name: MQTT_EXTERNAL_HOST
              value: "{{ include "aiida.emqx.external-host" . }}"
            - name: AIIDA_CORS_ALLOWED_ORIGINS
              value: "{{ if eq .Values.ingress.tlsEnabled true }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}"
            - name: AIIDA_PUBLIC_URL
              value: "{{ if eq .Values.ingress.tlsEnabled true }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}{{ .Values.core.path }}"
            - name: MQTT_PASSWORD
              value: {{ .Values.core.mqttPassword | quote }}
            - name: LOGGING_LEVEL_ENERGY_EDDIE
              value: "TRACE"
          readinessProbe:
            httpGet:
              path: {{ .Values.core.path }}/actuator/health/readiness
              port: core
          livenessProbe:
            httpGet:
              path: {{ .Values.core.path }}/actuator/health/liveness
              port: core

      imagePullSecrets:
        - name: {{ .Values.ghcrImagePullSecrets.name }}
