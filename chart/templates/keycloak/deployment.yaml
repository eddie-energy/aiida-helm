apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  {{- include "aiida.keycloak.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-keycloak
  template:
    metadata:
    {{- include "aiida.keycloak.labels" . | indent 6 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/keycloak/secret.yaml") . | sha256sum }}
        checksum/configmap-realm: {{ include (print $.Template.BasePath "/keycloak/configmap-realm.yaml") . | sha256sum }}
        checksum/configmap-theme: {{ include (print $.Template.BasePath "/keycloak/configmap-theme.yaml") . | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:{{ .Values.keycloak.version }}"
          args: ["-v", "start", "--import-realm", "--log-level=DEBUG"]
          ports:
            - name: keycloak
              containerPort: {{ .Values.keycloak.port }}
            - name: management
              containerPort: {{ .Values.keycloak.managementPort }}
          env:
            - name: KC_HOSTNAME
              value: "{{ include "aiida.keycloak.external-host" . }}"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: {{ .Values.keycloak.path }}
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "{{ include "aiida.timescaledb.jdbc-url" . }}"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: password
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-secret
                  key: adminUsername
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                  secretKeyRef:
                    name: {{ .Release.Name }}-keycloak-secret
                    key: adminPassword
          volumeMounts:
            - name: keycloak-realm-config
              mountPath: /opt/keycloak/data/import/
            - name: keycloak-theme-config
              mountPath: /opt/keycloak/themes/eddie-theme/
          readinessProbe:
            httpGet:
              path: {{ .Values.keycloak.path }}/health/ready
              port: management

      volumes:
        - name: keycloak-realm-config
          configMap:
            name: {{ .Release.Name }}-keycloak-realm-config
        - name: keycloak-theme-config
          configMap:
            name: {{ .Release.Name }}-keycloak-theme-config
            items:
              - key: theme.properties
                path: login/theme.properties
              - key: styles.css
                path: login/resources/css/styles.css
              - key: eddie.svg
                path: login/resources/images/eddie.svg
