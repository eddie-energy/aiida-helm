apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-emqx-config
  {{- include "aiida.emqx.labels" . | indent 2 }}
data:
  replace-password-with-env.sh: |-
    #!/bin/sh
    set -e

    if [ -z "${AIIDA_MQTT_PASSWORD}" ]; then
      echo "Error: AIIDA_MQTT_PASSWORD environment variable is not set."
      exit 1
    fi

    PART_TO_REPLACE="REPLACED_BY_ENV"
    INIT_USER_FILE="/tmp/init-user.json"
    BOOTSTRAP_FILE="/opt/emqx/data/init-user.json"

    sed "s|${PART_TO_REPLACE}|${AIIDA_MQTT_PASSWORD}|g" "${INIT_USER_FILE}" > "${BOOTSTRAP_FILE}"

    echo "SUCCESSFULLY REPLACED"

    exec /usr/bin/docker-entrypoint.sh emqx foreground


  init-user.json: |-
    [
      {
        "user_id": "aiida",
        "password": "REPLACED_BY_ENV",
        "is_superuser": true
      }
    ]

  emqx.hocon: |-
    authentication = [
      {
        backend = postgresql
        database = {{ .Values.timescaledb.database }}
        disable_prepared_statements = false
        enable = true
        mechanism = password_based
        username = emqx
        password = {{ .Values.core.mqttPassword }}
        password_hash_algorithm { 
          name = bcrypt
        }
        pool_size = 8
        query = """~
          SELECT mqtt_password AS password_hash
          FROM public.data_source
          WHERE mqtt_username = ${username}
          LIMIT 1;~"""
        server = "{{ .Release.Name }}-timescaledb:5432"
        ssl {
          ciphers = []
          depth = 10
          enable = false
          hibernate_after = "5s"
          log_level = notice
          reuse_sessions = true
          secure_renegotiate = true
          verify = verify_peer
          versions = [
            "tlsv1.3",
            "tlsv1.2"
          ]
        }
      }
      {
        backend = built_in_database
        mechanism = password_based
        password_hash_algorithm {
          name = bcrypt
        }
        user_id_type = username

        bootstrap_file = "/opt/emqx/data/init-user.json"
        bootstrap_type = plain
      }
    ]
    authorization {
      cache {
        enable = true
        excludes = []
        max_size = 32
        ttl = "1m"
      }
      deny_action = ignore
      no_match = deny
      sources = [
        {
          type = postgresql
          database = {{ .Values.timescaledb.database }}
          disable_prepared_statements = false
          enable = true
          username = emqx
          password = {{ .Values.core.mqttPassword }}
          pool_size = 8
          query = """~
            SELECT LOWER(action) AS action, LOWER(acl_type) AS permission, mqtt_subscribe_topic AS topic
            FROM public.data_source
            WHERE mqtt_username = ${username};~"""
          server = "{{ .Release.Name }}-timescaledb:5432"
          ssl {
            ciphers = []
            depth = 10
            enable = false
            hibernate_after = "5s"
            log_level = notice
            reuse_sessions = true
            secure_renegotiate = true
            verify = verify_peer
            versions = [
              "tlsv1.3",
              "tlsv1.2"
            ]
          }
        }
      ]
    }
