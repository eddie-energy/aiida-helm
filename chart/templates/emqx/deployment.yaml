apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-emqx
  {{- include "aiida.emqx.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.emqx.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-emqx
  template:
    metadata:
    {{- include "aiida.emqx.labels" . | indent 6 }}
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/emqx/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: emqx
          image: "emqx/emqx:{{ .Values.emqx.version }}"
          command: ["/tmp/replace-password-with-env.sh"]
          ports:
            - name: mqtt-std
              containerPort: {{ .Values.emqx.stdPort }}
              protocol: TCP
            - name: mqtt-ssl
              containerPort: {{ .Values.emqx.sslPort }}
              protocol: TCP
            - name: mqtt-dashboard
              containerPort: {{ .Values.emqx.dashboardPort }}
              protocol: TCP
          env:
            - name: AIIDA_MQTT_PASSWORD
              value: {{ .Values.core.mqttPassword }}
            - name: EMQX_AUTHENTICATION__1__DATABASE
              value: {{ .Values.timescaledb.database }}
            - name: EMQX_AUTHENTICATION__1__SERVER
              value: {{ .Release.Name }}-timescaledb:{{ .Values.timescaledb.port }}
            - name: EMQX_AUTHENTICATION__1__PASSWORD
              value: {{ .Values.emqx.databasePassword }}
            - name: EMQX_AUTHORIZATION__SOURCES__1__DATABASE
              value: {{ .Values.timescaledb.database }}
            - name: EMQX_AUTHORIZATION__SOURCES__1__SERVER
              value: {{ .Release.Name }}-timescaledb:{{ .Values.timescaledb.port }}
            - name: EMQX_AUTHORIZATION__SOURCES__1__PASSWORD
              value: {{ .Values.emqx.databasePassword }}
          volumeMounts:
            - name: emqx-config
              mountPath: /opt/emqx/etc/base.hocon
              subPath: emqx.hocon
            - name: emqx-config
              mountPath: /tmp/init-user.json
              subPath: init-user.json
            - name: emqx-config
              mountPath: /tmp/replace-password-with-env.sh
              subPath: replace-password-with-env.sh
          readinessProbe:
            tcpSocket:
              port: mqtt-std

      volumes:
        - name: emqx-config
          configMap:
            name: {{ .Release.Name }}-emqx-config
            defaultMode: 0755
