name: Publish Helm chart

on:
  push:
    branches: [ main ]
    paths: [ 'chart/Chart.yaml' ]
  workflow_dispatch:

jobs:
  package-and-push-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          helm package chart --destination /tmp/chart-dist
          chart_file=$(ls /tmp/chart-dist/aiida-*.tgz)
          OWNER_LOWERCASED="${GITHUB_REPOSITORY_OWNER,,}"
          helm push "$chart_file" "oci://ghcr.io/$OWNER_LOWERCASED/charts"


